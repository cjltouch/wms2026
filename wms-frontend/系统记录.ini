技术栈
Vue 3.5 + TypeScript + Vite 5.4
Element Plus 2.8 + @element-plus/icons-vue
Pinia (状态管理) + Vue Router 4
Axios (HTTP) + ECharts (图表)
SCSS 样式 + NProgress 进度条
项目结构（34个源文件）


wms-frontend/
├── src/
│   ├── api/          # API 封装 (auth.ts, index.ts)
│   ├── layout/       # 主布局 (侧边栏+顶栏+内容区)
│   ├── router/       # 路由配置 (14个路由组+权限守卫)
│   ├── store/        # Pinia Store (user.ts)
│   ├── styles/       # 全局样式
│   ├── utils/        # axios 封装 (JWT拦截器)
│   └── views/        # 23个页面
│       ├── login/    # 登录页
│       ├── dashboard/ # 仪表盘(6卡片+趋势图+饼图+TOP10)
│       ├── goods/     # 商品SPU/分类/品牌/单位 (4页)
│       ├── partner/  # 供应商/客户 (2页)
│       ├── warehouse/ # 仓库/库区/库位 (3页)
│       ├── purchase/  # 采购管理 (1页)
│       ├── stockin/   # 入库管理 (1页)
│       ├── stockout/  # 出库管理 (1页)
│       ├── transfer/  # 调拨管理 (1页)
│       ├── sale/      # 销售管理 (1页)
│       ├── loss/      # 报损管理 (1页)
│       ├── check/     # 盘点管理 (1页)
│       ├── inventory/ # 库存查询/流水 (2页)
│       └── system/    # 用户/角色/菜单 (3页)

访问地址
前端页面: http://localhost:3000
后端API文档: http://localhost:8080/wms-api/doc.html
登录账号: admin / 123456
功能特性
登录页：JWT 认证，token 存储 localStorage
主布局：可折叠侧边栏 + 面包屑 + 用户下拉菜单
仪表盘：6张统计卡片 + ECharts 趋势图/饼图 + TOP10表格
业务单据页：搜索表单 + 状态流转按钮 + 明细表格行内编辑 + 分页
权限守卫：未登录自动跳转登录页

