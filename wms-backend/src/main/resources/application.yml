server:
  port: 8080
  servlet:
    context-path: /wms-api
  tomcat:
    max-http-form-post-size: 10MB

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      WRITE_BIGDECIMAL_AS_PLAIN: true
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/wms_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: "123456"
    hikari:
      min-idle: 5
      max-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: WMS-HikariCP
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

jwt:
  secret: "change-me-in-prod-please-use-64bytes-strong-key-XXXXXXXXXXXXXXXX1234567890123456"
  access-token-expire-minutes: 720
  refresh-token-expire-days: 7

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.wms.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: not_null
      insert-strategy: not_null

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: system
      pathsToMatch: /api/system/**
      packagesToScan: com.example.wms.system
    - group: business
      pathsToMatch: /api/wms/**
      packagesToScan: com.example.wms.business
    - group: report
      pathsToMatch: /api/report/**
      packagesToScan: com.example.wms.report

logging:
  level:
    root: INFO
    com.example.wms: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/wms.log
    total-size-cap: 5GB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 50MB
